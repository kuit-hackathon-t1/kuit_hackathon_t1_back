# 로컬 개발용 MySQL 연결 프로필
# 실행: ./gradlew bootRun --args='--spring.profiles.active=local'
# 또는 환경변수: SPRING_PROFILES_ACTIVE=local
#
# docker-compose.yml의 기본값과 맞춰져 있어 별도 설정 없이 바로 연결됩니다.
# 필요 시 환경변수(DB_HOST/DB_PORT/DB_NAME/DB_USERNAME/DB_PASSWORD)로 덮어쓸 수 있습니다.

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:kuit_hackathon}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# AI 미션 추천(Gemini API) 설정
# GEMINI_API_KEY는 절대 커밋하지 말고 환경변수로만 주입할 것 (예: IntelliJ Run Configuration, 셸 export 등).
gemini:
  api-key: ${GEMINI_API_KEY:}
  # gemini-2.0-flash는 2026-06-01부로 종료된 모델이라 gemini-2.5-flash를 기본값으로 사용한다.
  model: ${GEMINI_MODEL:gemini-2.5-flash}
